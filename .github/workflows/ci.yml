name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Reads rust-toolchain.toml (channel, rustfmt, clippy). An empty
      # build-warnings value keeps Cargo's default so the steps below are
      # the only warning gate.
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          build-warnings: ""

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

  expand-time:
    name: user compile time
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          build-warnings: ""

      - name: Measure impl_foreach in a user crate
        run: ./benches/crates/ph_util_foreach/measure.sh

      - name: Upload expand-time report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ph-util-foreach-expand-time
          if-no-files-found: error
          path: |
            target/ph-util-foreach-expand/report.txt
            target/ph-util-foreach-expand/logs
