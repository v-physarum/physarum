name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Reads rust-toolchain.toml (channel, rustfmt, clippy). An empty
      # build-warnings value keeps Cargo's default so the steps below are
      # the only warning gate.
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          build-warnings: ""

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  runtime:
    name: runtime bench
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          build-warnings: ""

      # The bench runs offline. Fetch first so a cold registry cache still
      # has the crates.
      - name: Fetch dependencies
        run: cargo fetch

      - name: Run the foreach runtime bench
        run: cargo bench --bench ph_util_foreach_runtime --offline
