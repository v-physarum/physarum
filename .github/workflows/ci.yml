name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Reads rust-toolchain.toml (channel, rustfmt, clippy). An empty
      # build-warnings value keeps Cargo's default so the steps below are
      # the only warning gate.
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          build-warnings: ""

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  expand-time:
    name: user compile time
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          build-warnings: ""

      # `ph_bench_build` invokes this binary. This crate does not.
      - name: Install hyperfine
        run: |
          curl -fsSL -o /tmp/hyperfine.tar.gz https://github.com/sharkdp/hyperfine/releases/download/v2.0.0/hyperfine-v2.0.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/hyperfine.tar.gz -C /tmp
          sudo install -m 755 /tmp/hyperfine-v2.0.0-x86_64-unknown-linux-gnu/hyperfine /usr/local/bin/hyperfine

      # The bench and the measured builds run offline. Fetch first so a cold
      # registry cache still has the crates.
      - name: Fetch dependencies
        run: cargo fetch

      - name: Measure impl_foreach in a user crate
        run: cargo bench --bench ph_util_foreach_measure --offline

      - name: Measure impl_foreach scale series
        run: cargo bench --bench ph_util_foreach_series --offline

  typeck-ceiling:
    name: nightly typeck ceiling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          build-warnings: ""

      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal

      # ph_beans is not on this branch. The ceiling measures its map chain.
      # The commit is pinned so the job does not follow a moving branch tip.
      - name: Check out ph_beans
        run: |
          git fetch origin cursor/ph-beans-derive-a16f
          git checkout 89682756b358f1a9c88129c6a4744db4e62e4ea9 -- crates/ph_beans crates/ph_beans_derive
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Cargo.toml")
          text = path.read_text()
          needle = '    "crates/benches/ph_bench_build",\n'
          insert = needle + '    "crates/ph_beans",\n'
          if '"crates/ph_beans"' not in text:
              if needle not in text:
                  raise SystemExit("workspace members list changed")
              path.write_text(text.replace(needle, insert, 1))
          PY

      - name: Type-check ceiling
        run: cargo test -p ph_bench_build --test typeck_ceiling -- --ignored --nocapture
