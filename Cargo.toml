[package]
name = "physarum"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only OR LicenseRef-Commercial"
repository = "https://github.com/v-physarum/physarum"
description = "TODO: the owner fills in the project purpose."

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dev-dependencies]
ph_bench_build = { path = "crates/benches/ph_bench_build" }
ph_proc_macro_dylib = { path = "crates/tests/ph_proc_macro_dylib" }
ph_test_errors = { path = "crates/tests/ph_test_errors" }
ph_util_foreach = { path = "crates/util/ph_util_foreach" }

[[test]]
name = "ph_util_foreach_bindings"
path = "tests/crates/ph_util_foreach/bindings.rs"

[[test]]
name = "ph_util_foreach_errors"
path = "tests/crates/ph_util_foreach/errors.rs"

[[test]]
name = "ph_util_foreach_flat_structs"
path = "tests/crates/ph_util_foreach/flat_structs.rs"

[[test]]
name = "ph_util_foreach_impl_take"
path = "tests/crates/ph_util_foreach/impl_take.rs"

[[test]]
name = "ph_util_foreach_patterns"
path = "tests/crates/ph_util_foreach/patterns.rs"

[[test]]
name = "ph_util_foreach_placeholders"
path = "tests/crates/ph_util_foreach/placeholders.rs"

[[test]]
name = "ph_util_foreach_step_structs"
path = "tests/crates/ph_util_foreach/step_structs.rs"

[[test]]
name = "ph_util_foreach_tokens"
path = "tests/crates/ph_util_foreach/tokens.rs"

[[bench]]
name = "ph_util_foreach_measure"
harness = false
path = "benches/crates/ph_util_foreach/measure.rs"

[[bench]]
name = "ph_util_foreach_series"
harness = false
path = "benches/crates/ph_util_foreach/series.rs"

[workspace]
resolver = "3"
members = [
    "crates/benches/ph_bench_build",
    "crates/ph_beans",
    "crates/tests/ph_proc_macro_dylib",
    "crates/tests/ph_test_asm",
    "crates/tests/ph_test_errors",
    "crates/util/ph_util_foreach",
]
