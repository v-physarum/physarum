[package]
name = "ph_beans"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
repository = "https://github.com/v-physarum/physarum"
description = "Query pipeline for beans."
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dev-dependencies]
ph_test_asm = { path = "../tests/ph_test_asm" }
ph_test_errors = { path = "../tests/ph_test_errors" }

[[test]]
name = "tree"
path = "../../tests/crates/ph_beans/tree.rs"

[[test]]
name = "errors"
path = "../../tests/crates/ph_beans/errors.rs"

[[test]]
name = "schedule"
path = "../../tests/crates/ph_beans/schedule.rs"

[[test]]
name = "dyn_view"
path = "../../tests/crates/ph_beans/dyn_view.rs"

[[test]]
name = "perf"
path = "../../tests/crates/ph_beans/perf.rs"
