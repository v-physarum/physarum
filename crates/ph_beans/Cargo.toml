[package]
name = "ph_beans"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
repository = "https://github.com/v-physarum/physarum"
description = "Static provide, inject, and tick container."
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
ph_util_foreach = { path = "../util/ph_util_foreach" }

[dev-dependencies]
ph_beans_derive = { path = "../ph_beans_derive" }
ph_proc_macro_dylib = { path = "../tests/ph_proc_macro_dylib" }
ph_test_asm = { path = "../tests/ph_test_asm" }
ph_test_errors = { path = "../tests/ph_test_errors" }

[[test]]
name = "tree"
path = "../../tests/crates/ph_beans/tree.rs"

[[test]]
name = "errors"
path = "../../tests/crates/ph_beans/errors.rs"

[[test]]
name = "asm"
path = "../../tests/crates/ph_beans/asm.rs"
