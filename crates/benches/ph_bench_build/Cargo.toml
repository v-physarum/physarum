[package]
name = "ph_bench_build"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
repository = "https://github.com/v-physarum/physarum"
description = "Hyperfine runner for cases selected by a directory layout."

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "display"] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
