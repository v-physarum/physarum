[package]
name = "ph_derive"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
repository = "https://github.com/v-physarum/physarum"
description = "Derive macros for the ph_beans container."
readme = "README.md"

[lib]
proc-macro = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
proc-macro2 = { version = "1.0.107", default-features = false, features = ["proc-macro"] }
quote = { version = "1.0.47", default-features = false, features = ["proc-macro"] }
syn = { version = "2.0.106", features = ["derive", "full"] }
